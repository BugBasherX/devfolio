<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Admin Portal — Yuvraj Kurmi</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23111%27/%3E%3Cpath d=%27M16 6l8 5v6c0 5.5-3.5 10-8 12-4.5-2-8-6.5-8-12V11l8-5z%27 fill=%27none%27 stroke=%27%2300f0ff%27 stroke-width=%272%27/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0c10;
      --card: #12141c;
      --card-border: #1f2330;
      --cyan: #00f0ff;
      --cyan-dim: rgba(0, 240, 255, 0.12);
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --text: #f3f4f6;
      --mute: #8e96a4;
      --font-mono: 'JetBrains Mono', monospace;
      --font-serif: 'Literata', Georgia, serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
    }
    header {
      max-width: 1000px;
      margin: 0 auto 2rem;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 1rem;
    }
    .brand {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .db-badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--cyan-dim);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: var(--cyan);
    }
    main {
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      flex-grow: 1;
    }
    /* Auth Form Box */
    #auth-view {
      max-width: 420px;
      margin: 10vh auto 0;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      background: #06070a;
      border: 1px solid var(--card-border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.75rem 1rem;
      border-radius: 4px;
      margin: 1rem 0;
      outline: none;
    }
    input:focus { border-color: var(--cyan); }
    button {
      background: var(--cyan);
      color: #000;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.88rem;
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    .btn-outline {
      background: transparent;
      color: var(--mute);
      border: 1px solid var(--card-border);
    }
    .btn-outline:hover { color: var(--text); border-color: var(--text); }
    /* Dashboard View */
    #dashboard-view { display: none; }
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 0.5rem;
    }
    .tab-btn {
      background: transparent;
      color: var(--mute);
      border: none;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
    }
    .tab-btn.active {
      color: var(--cyan);
      border-bottom: 2px solid var(--cyan);
    }
    .card-list { display: flex; flex-direction: column; gap: 1rem; }
    .inquiry-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 1.25rem;
      position: relative;
    }
    .inquiry-card.unread { border-left: 3px solid var(--cyan); }
    .inquiry-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 0.75rem;
      color: var(--mute);
    }
    .inquiry-sender {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.25rem;
    }
    .inquiry-email {
      color: var(--cyan);
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
      display: block;
    }
    .inquiry-msg {
      font-family: var(--font-serif);
      font-size: 0.95rem;
      line-height: 1.6;
      color: #d1d5db;
      background: rgba(0,0,0,0.2);
      padding: 0.85rem;
      border-radius: 4px;
      margin-bottom: 0.75rem;
      white-space: pre-wrap;
    }
    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    .table th, .table td {
      border: 1px solid var(--card-border);
      padding: 0.65rem 0.85rem;
      text-align: left;
    }
    .table th { background: #08090d; color: var(--mute); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>⚡ YK // ADMIN CONSOLE</span>
      <span class="db-badge" id="db-badge">Connecting...</span>
    </div>
    <div id="header-actions" style="display:none; gap:0.5rem;">
      <button type="button" class="btn-outline" onclick="loadData()">↻ Refresh</button>
      <button type="button" class="btn-outline" onclick="logout()">Logout</button>
      <a href="/" style="color:var(--mute); font-size:0.8rem; padding: 0.5rem;">← Portfolio</a>
    </div>
  </header>

  <main>
    <!-- 1. Authentication View -->
    <div id="auth-view">
      <div style="font-size: 1.5rem; margin-bottom: 0.5rem;">🔐</div>
      <h2 style="font-size: 1.1rem; margin-bottom: 0.5rem;">Restricted Access</h2>
      <p style="font-size: 0.8rem; color: var(--mute);">Enter your Bearer Admin Key to inspect incoming inquiries and security telemetry.</p>
      <form onsubmit="handleAuth(event)">
        <input type="password" id="admin-key-input" placeholder="Paste your ADMIN_KEY..." required autocomplete="off" />
        <button type="submit" style="width:100%;">Authenticate</button>
        <div id="auth-error" style="color:var(--rose); font-size:0.75rem; margin-top:0.75rem;"></div>
      </form>
    </div>

    <!-- 2. Dashboard View -->
    <div id="dashboard-view">
      <div class="tabs">
        <button class="tab-btn active" id="tab-inquiries-btn" onclick="switchTab('inquiries')">Inquiries (<span id="inquiry-count">0</span>)</button>
        <button class="tab-btn" id="tab-security-btn" onclick="switchTab('security')">Security Audit Logs (<span id="log-count">0</span>)</button>
      </div>

      <!-- Inquiries Tab -->
      <div id="inquiries-panel">
        <div class="card-list" id="inquiries-list">
          <div style="color:var(--mute); font-size:0.85rem;">No inquiries recorded yet.</div>
        </div>
      </div>

      <!-- Security Logs Tab -->
      <div id="security-panel" style="display:none;">
        <table class="table">
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Event</th>
              <th>IP Hash (Privacy Anonymized)</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody id="security-table-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    let token = localStorage.getItem('yk_admin_token') || '';

    async function checkAuth() {
      if (!token) return;
      try {
        const res = await fetch('/api/admin/inquiries', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (res.ok) {
          showDashboard();
          loadData();
        } else {
          localStorage.removeItem('yk_admin_token');
        }
      } catch (e) {}
    }

    async function handleAuth(e) {
      e.preventDefault();
      const input = document.getElementById('admin-key-input').value.trim();
      const errEl = document.getElementById('auth-error');
      errEl.textContent = 'Verifying key...';

      try {
        const res = await fetch('/api/admin/inquiries', {
          headers: { 'Authorization': 'Bearer ' + input }
        });
        if (res.ok) {
          token = input;
          localStorage.setItem('yk_admin_token', token);
          errEl.textContent = '';
          showDashboard();
          loadData();
        } else {
          errEl.textContent = 'Invalid Admin Key (401 Unauthorized)';
        }
      } catch (err) {
        errEl.textContent = 'Server connection error';
      }
    }

    function showDashboard() {
      document.getElementById('auth-view').style.display = 'none';
      document.getElementById('dashboard-view').style.display = 'block';
      document.getElementById('header-actions').style.display = 'flex';
    }

    function logout() {
      localStorage.removeItem('yk_admin_token');
      location.reload();
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (tab === 'inquiries') {
        document.getElementById('tab-inquiries-btn').classList.add('active');
        document.getElementById('inquiries-panel').style.display = 'block';
        document.getElementById('security-panel').style.display = 'none';
      } else {
        document.getElementById('tab-security-btn').classList.add('active');
        document.getElementById('inquiries-panel').style.display = 'none';
        document.getElementById('security-panel').style.display = 'block';
      }
    }

    async function loadData() {
      // 1. Inquiries
      try {
        const res = await fetch('/api/admin/inquiries', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (res.ok) {
          const data = await res.json();
          document.getElementById('db-badge').textContent = data.database || 'Active Database';
          document.getElementById('inquiry-count').textContent = data.count || 0;
          renderInquiries(data.inquiries || []);
        }
      } catch (e) {}

      // 2. Security Logs
      try {
        const res = await fetch('/api/admin/security-logs', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (res.ok) {
          const data = await res.json();
          document.getElementById('log-count').textContent = data.count || 0;
          renderSecurityLogs(data.logs || []);
        }
      } catch (e) {}
    }

    function renderInquiries(inquiries) {
      const list = document.getElementById('inquiries-list');
      if (!inquiries.length) {
        list.innerHTML = '<div style="color:var(--mute); padding: 2rem; text-align:center;">No inquiries recorded yet.</div>';
        return;
      }

      list.innerHTML = inquiries.map(inq => `
        <div class="inquiry-card ${inq.status === 'unread' ? 'unread' : ''}">
          <div class="inquiry-meta">
            <span>ID: ${inq.id} &bull; IP Hash: ${inq.ip_hash || 'unknown'}</span>
            <span>${inq.created_at}</span>
          </div>
          <div class="inquiry-sender">${escapeHtml(inq.name)}</div>
          <a class="inquiry-email" href="mailto:${escapeHtml(inq.email)}">${escapeHtml(inq.email)} &rarr;</a>
          <div class="inquiry-msg">${escapeHtml(inq.message)}</div>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:0.75rem; color:${inq.status === 'unread' ? 'var(--cyan)' : 'var(--mute)'};">Status: ${inq.status.toUpperCase()}</span>
            ${inq.status === 'unread' ? `<button type="button" class="btn-outline" style="font-size:0.72rem; padding:3px 8px;" onclick="markRead('${inq.id}')">Mark as Read</button>` : ''}
          </div>
        </div>
      `).join('');
    }

    function renderSecurityLogs(logs) {
      const tbody = document.getElementById('security-table-body');
      tbody.innerHTML = logs.map(l => `
        <tr>
          <td style="color:var(--mute);">${l.created_at}</td>
          <td style="color:var(--amber); font-weight:600;">${escapeHtml(l.event_type)}</td>
          <td style="font-family:var(--font-mono); font-size:0.75rem;">${escapeHtml(l.ip_hash)}</td>
          <td style="color:var(--mute);">${escapeHtml(l.details || '-')}</td>
        </tr>
      `).join('');
    }

    async function markRead(id) {
      try {
        await fetch('/api/admin/inquiries/' + id + '/read', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        loadData();
      } catch (e) {}
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    checkAuth();
  </script>
</body>
</html>
